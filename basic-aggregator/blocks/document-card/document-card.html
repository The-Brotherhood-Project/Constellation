<!-- Generic Document Card Block -->
<article class="document-card {featured_class}" data-doc-id="{id}">
    <div class="doc-card-header">
        <div class="doc-card-badges">
            {badges_html}
        </div>
        <span class="doc-card-size">{size_kb} KB</span>
    </div>
    <h3 class="doc-card-title">
        <a href="#view={id}" class="doc-link-action" data-doc-id="{id}">{title}</a>
    </h3>
    <p class="doc-card-description">{description}</p>
    <div class="doc-card-actions">
        <button type="button" class="btn btn-primary btn-small doc-view-btn" data-doc-id="{id}">
            <span class="btn-icon">📖</span>
            <span class="btn-text">📖 Read Document</span>
        </button>
        <a href="content/documents/{file_name}" download class="btn btn-secondary btn-small doc-download-btn">
            <span class="btn-icon">💾</span>
            <span class="btn-text">💾 Download Original</span>
        </a>
    </div>
</article>
