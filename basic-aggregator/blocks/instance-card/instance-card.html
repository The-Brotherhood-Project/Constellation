<!-- Instance Card Block -->
<article class="instance-card {featured_class}" data-instance-id="{id}">
    <div class="instance-card-header">
        <div class="instance-card-badges">
            <span class="badge badge-status {status_class}">{status}</span>
            <span class="badge badge-type">{service_type}</span>
            {badges_html}
        </div>
        {version_html}
    </div>
    <h3 class="instance-card-title">
        <a href="{host_url}" target="_blank" rel="noopener noreferrer">{name}</a>
    </h3>
    <div class="instance-operator">Operator: <strong>{operator}</strong></div>
    {did_html}
    <p class="instance-card-description">{description}</p>
    <div class="instance-card-actions">
        <a href="{host_url}" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-small">
            <span class="btn-icon">🌐</span>
            <span class="btn-text">🌐 Go To</span>
        </a>
    </div>
</article>
